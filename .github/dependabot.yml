version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    # The only image here is srsp/ansible, which is ours; take its releases on the day they're published.
    cooldown:
      default-days: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

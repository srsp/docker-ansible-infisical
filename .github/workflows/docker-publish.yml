name: Docker Publish

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
  repository_dispatch:
    types:
      - tag-publish

env:
  IMAGE_NAME: ansible-infisical
  REGISTRY_USER: srsp
  # Fork PRs get no secrets, so they only build and test.
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:

    runs-on: [self-hosted, mr-amd64]
    permissions:
      contents: read

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}
      -
        name: Resolve publish context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          is_version_tag=false
          version_tag=""

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            version_tag="$DISPATCH_TAG"
          elif [[ "$REF" == refs/tags/v* ]]; then
            version_tag="$REF_NAME"
          fi

          if [[ "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_version_tag=true
          else
            version_tag=""
          fi

          echo "is_version_tag=$is_version_tag" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # https://github.com/docker/login-action
      # Dependabot PRs read DOCKER_HUB_TOKEN from the Dependabot secrets, not the Actions secrets.
      - name: Log into Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ steps.context.outputs.is_version_tag != 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ steps.context.outputs.version_tag }},enable=${{ steps.context.outputs.is_version_tag == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.context.outputs.version_tag }},enable=${{ steps.context.outputs.is_version_tag == 'true' }}

      # https://github.com/docker/build-push-action
      - name: Build Docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:test

      - name: Test Docker image
        run: |
          docker run --rm ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:test /usr/local/bin/verify-tools
          docker run --rm ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:test infisical --version

      - name: Build and push Docker image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
